[workspace]
resolver = "2"
members = [
    # Tooling
    "crates/arch-lint",
    # L1 — Pure domain types, protocol, & policy (zero I/O)
    "crates/webmcp-protocol",
    "crates/webmcp-policy",
    # L2 — Concrete I/O adapters (depend only on L1)
    "crates/webmcp-auth",
    "crates/webmcp-ws",
    "crates/webmcp-mcp",
    # L3 — Composition root
    "apps/webmcp-bridge",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"

# Async & HTTP/WebSocket
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "net", "signal"] }

# Security & IDs
rand = "0.9"
subtle = "2.6"
uuid = { version = "1", features = ["v4", "serde"] }

# CLI & tooling
clap = { version = "4", features = ["derive"] }
walkdir = "2"

# Test-only WebSocket client
tokio-tungstenite = "0.26"

# Internal workspace crates
webmcp-protocol = { path = "crates/webmcp-protocol" }
webmcp-policy = { path = "crates/webmcp-policy" }
webmcp-auth = { path = "crates/webmcp-auth" }
webmcp-ws = { path = "crates/webmcp-ws" }
webmcp-mcp = { path = "crates/webmcp-mcp" }
